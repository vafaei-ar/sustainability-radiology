benchmark:
  framework: MONAI
  measurement: experiment-impact-tracker
  n_iterations: 5000
  input:
    classification_2d:
      batch_size: 256
      shape_per_sample: [1, 256, 256]
    classification_3d:
      batch_size: 64
      shape_per_sample: [1, 256, 256, 32]
    segmentation_2d:
      batch_size: 64
      shape_per_sample: [1, 256, 256]
    segmentation_3d:
      batch_size: 64
      shape_per_sample: [1, 256, 256, 32]

normalization:
  definition: individual sample processed by one model forward pass
  tracker_total_power_per_inference: Total_power / (n_iterations * batch_size)
  tracker_total_power_per_1000_inferences: 1000 * tracker_total_power_per_inference
  physical_unit_status: unresolved_historical_tracker_semantics

notes:
  - The historical CSV column Kg_carbon(batch=1000) divided by batch size but not by n_iterations.
  - Recalculate normalized tracker total_power before population extrapolation.
  - Do not label historical Total_power-derived endpoints as kWh until the tracker unit is verified from source or an independent calibration.
  - The benchmark input is not automatically equivalent to one clinical radiology examination.
  - Clinical workload multipliers must be defined separately by modality and task.
