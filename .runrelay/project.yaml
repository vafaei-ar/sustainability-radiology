schema_version: 1

project:
  id: sustainability-radiology
  repo: vafaei-ar/sustainability-radiology
  visibility: public

execution:
  profile: safe
  approval_default: manual
  machine_binding: fixed
  machine_id: pshjl4vf24
  runner_source: runrelay_control_repo
  exact_commit: true
  allow_arbitrary_commands: false

security:
  project_only_filesystem: true
  network_access: true
  inherit_environment: false
  destructive_operations: false

monitoring:
  heartbeat_seconds: 60
  telegram_include_log_tail: true
  tmux_default: false

tasks:
  smoke_test:
    description: Non-destructive RunRelay connectivity test.
    command:
      - python3
      - -c
      - "import os,platform; print('RUNRELAY_SMOKE_OK'); print('host='+platform.node()); print('cwd='+os.getcwd())"
    approval: manual
    timeout_minutes: 5
    requires_gpu: false
    working_directory: .

  wp1_source_inventory:
    description: Read-only inventory of exact WP1 benchmark CSV filenames under /home/asadr/works, reporting only paths, sizes, and SHA256 digests.
    command:
      - python3
      - scripts/inventory_wp1_sources.py
    approval: manual
    timeout_minutes: 10
    requires_gpu: false
    working_directory: .
    artifacts:
      - results/wp1/source_inventory.txt

  wp1_benchmark_audit:
    description: Materialize frozen benchmark inputs and normalize/audit the three measured historical MONAI GPU benchmark tables using fixed checksums and architecture-matched summaries.
    command:
      - python3
      - scripts/run_wp1_from_gzip.py
    approval: manual
    timeout_minutes: 10
    requires_gpu: false
    working_directory: .
    artifacts:
      - results/wp1/normalized_runs.csv
      - results/wp1/architecture_coverage.csv
      - results/wp1/matched_architecture_summary.csv
      - results/wp1/run_variability.csv
      - results/wp1/wp1_report.md

  wp1_benchmark_audit_legacy_source:
    description: Stage the three checksum-verified historical benchmark summaries from the known legacy project tree and run the WP1 audit.
    command:
      - python3
      - scripts/run_wp1_from_legacy_source.py
    approval: manual
    timeout_minutes: 10
    requires_gpu: false
    working_directory: .
    artifacts:
      - results/wp1/normalized_runs.csv
      - results/wp1/architecture_coverage.csv
      - results/wp1/matched_architecture_summary.csv
      - results/wp1/run_variability.csv
      - results/wp1/wp1_report.md

  wp1_hardware_comparison:
    description: Collapse WP1 replicates to architecture-level medians and compute paired cross-GPU energy ratios with architecture-resampled bootstrap intervals where adequately supported.
    command:
      - python3
      - scripts/run_wp1_hardware_comparison.py
    approval: manual
    timeout_minutes: 10
    requires_gpu: false
    working_directory: .
    artifacts:
      - results/wp1/architecture_level_summary.csv
      - results/wp1/paired_gpu_ratios.csv
      - results/wp1/wp1_hardware_comparison.md

  wp1_total_power_unit_audit:
    description: Read-only audit of experiment-impact-tracker package metadata and source excerpts to verify the semantics and unit of the historical total_power field.
    command:
      - python3
      - scripts/audit_experiment_impact_tracker_total_power.py
    approval: manual
    timeout_minutes: 10
    requires_gpu: false
    working_directory: .
    artifacts:
      - results/wp1/experiment_impact_tracker_total_power_audit.txt

  wp2_vlm_source_inventory:
    description: Read-only inventory of historical multimodal/VLM benchmark summaries and scripts under /home/asadr/works, recording only paths, sizes, and SHA256 digests.
    command:
      - python3
      - scripts/inventory_wp2_vlm_sources.py
    approval: manual
    timeout_minutes: 10
    requires_gpu: false
    working_directory: .
    artifacts:
      - results/wp2/source_inventory.txt

  wp2_vlm_reconstruction:
    description: Verify frozen historical VLM sources, normalize tracker total_power by completed case calls, summarize model runs, and export source-grounded protocol evidence.
    command:
      - python3
      - scripts/run_wp2_vlm_reconstruction.py
    approval: manual
    timeout_minutes: 10
    requires_gpu: false
    working_directory: .
    artifacts:
      - results/wp2/historical_vlm_normalized_runs.csv
      - results/wp2/historical_vlm_model_summary.csv
      - results/wp2/historical_vlm_protocol_audit.md

  wp2_tracker_device_audit:
    description: Read-only audit of historical multimodal Experiment Impact Tracker logs for model-specific GPU/device and power evidence.
    command:
      - python3
      - scripts/audit_wp2_tracker_device.py
    approval: manual
    timeout_minutes: 10
    requires_gpu: false
    working_directory: .
    artifacts:
      - results/wp2/tracker_device_audit.txt

  wp3_validate_prospective_vlm_protocol:
    description: Validate the frozen prospective VLM benchmark configuration for required models, tasks, measurement boundaries, replication, and interpretation safeguards.
    command:
      - python3
      - scripts/validate_prospective_vlm_protocol.py
    approval: manual
    timeout_minutes: 5
    requires_gpu: false
    working_directory: .
    artifacts:
      - results/wp3/prospective_vlm_protocol_validation.md

  wp3_runtime_readiness:
    description: Read-only audit of the bound workstation runtime for prospective VLM benchmarking, including GPU visibility, CUDA/PyTorch, package versions, disk space, and token presence without exposing values.
    command:
      - python3
      - scripts/audit_wp3_runtime_readiness.py
    approval: manual
    timeout_minutes: 5
    requires_gpu: false
    working_directory: .
    artifacts:
      - results/wp3/runtime_readiness.md

  wp3_existing_ml_env_inventory:
    description: Read-only inventory of existing Python environments and Hugging Face cache metadata under /home/asadr/works to identify a reusable CUDA-capable VLM runtime without modifying the workstation.
    command:
      - python3
      - scripts/inventory_wp3_existing_ml_envs.py
    approval: manual
    timeout_minutes: 10
    requires_gpu: false
    working_directory: .
    artifacts:
      - results/wp3/existing_ml_env_inventory.txt

  wp3_setup_project_vlm_runtime:
    description: Create a project-local Python virtual environment and install the pinned CUDA-enabled WP3 VLM dependencies without modifying system Python or unrelated project environments.
    command:
      - python3
      - scripts/setup_wp3_vlm_runtime.py
    approval: manual
    timeout_minutes: 30
    requires_gpu: false
    working_directory: .
    artifacts:
      - results/wp3/runtime_setup_report.json

  wp3_qwen_gpu_smoke_pilot:
    description: Run one synthetic nonclinical Qwen2.5-VL-7B BF16 GPU inference after warmup and record direct NVIDIA board-power integration, utilization, runtime, tokens, and VRAM to validate the prospective measurement stack.
    command:
      - .venv-wp3/bin/python
      - scripts/run_wp3_qwen_smoke_pilot.py
    approval: manual
    timeout_minutes: 45
    requires_gpu: true
    working_directory: .
    artifacts:
      - results/wp3/qwen_smoke_pilot/report.json
      - results/wp3/qwen_smoke_pilot/gpu_trace.csv

  wp3_qwen_measurement_calibration:
    description: Measure repeatability of direct NVIDIA board-power integration with five warmed BF16 Qwen2.5-VL-7B synthetic blocks, each containing ten completed calls, plus an idle baseline.
    command:
      - .venv-wp3/bin/python
      - scripts/run_wp3_qwen_measurement_calibration.py
    approval: manual
    timeout_minutes: 30
    requires_gpu: true
    working_directory: .
    artifacts:
      - results/wp3/qwen_measurement_calibration/report.json
      - results/wp3/qwen_measurement_calibration/replicates.csv
      - results/wp3/qwen_measurement_calibration/gpu_trace.csv
      - results/wp3/qwen_measurement_calibration/idle_trace.csv

  wp3_prepare_openi_cxr_pilot:
    description: Download the public deidentified Open-I Indiana chest X-ray archives into the project-local WP3 data cache and freeze a deterministic 10-case single-image pilot manifest with source and file hashes.
    command:
      - python3
      - scripts/prepare_wp3_openi_cxr_pilot.py
    approval: manual
    timeout_minutes: 45
    requires_gpu: false
    working_directory: .
    artifacts:
      - results/wp3/openi_cxr_pilot/case_manifest.csv
      - results/wp3/openi_cxr_pilot/preparation_report.json

  wp3_openi_qwen_pilot:
    description: Run the frozen 10-case Open-I chest-radiograph single-image Qwen2.5-VL-7B BF16 pilot with block-level direct NVIDIA board-power integration and idle-baseline correction.
    command:
      - .venv-wp3/bin/python
      - scripts/run_wp3_openi_qwen_pilot.py
    approval: manual
    timeout_minutes: 30
    requires_gpu: true
    working_directory: .
    resources:
      gpu_count: 1
      min_vram_gb: 20
      wait_minutes: 30
    artifacts:
      - results/wp3/openi_qwen_pilot/report.json
      - results/wp3/openi_qwen_pilot/case_results.csv
      - results/wp3/openi_qwen_pilot/gpu_trace.csv
      - results/wp3/openi_qwen_pilot/idle_trace.csv

  wp3_openi_qwen_output_validation:
    description: Re-run the frozen 10-case Open-I Qwen2.5-VL-7B BF16 image-description task, compare generated text with public reference findings/impressions using transparent lexical screening metrics, and export a structured manual clinical-review table.
    command:
      - .venv-wp3/bin/python
      - scripts/validate_wp3_openi_qwen_outputs.py
    approval: manual
    timeout_minutes: 30
    requires_gpu: true
    working_directory: .
    resources:
      gpu_count: 1
      min_vram_gb: 20
      wait_minutes: 30
    artifacts:
      - results/wp3/openi_qwen_output_validation/summary.json
      - results/wp3/openi_qwen_output_validation/case_review.csv

  wp3_openi_qwen_prompt_sensitivity:
    description: Compare three deterministic report-style prompt formulations on the frozen 10-case Open-I Qwen2.5-VL-7B BF16 pilot before freezing the publication benchmark prompt.
    command:
      - .venv-wp3/bin/python
      - scripts/compare_wp3_openi_qwen_prompts.py
    approval: manual
    timeout_minutes: 30
    requires_gpu: true
    working_directory: .
    resources:
      gpu_count: 1
      min_vram_gb: 20
      wait_minutes: 30
    artifacts:
      - results/wp3/openi_qwen_prompt_sensitivity/report.json
      - results/wp3/openi_qwen_prompt_sensitivity/prompt_summary.csv
      - results/wp3/openi_qwen_prompt_sensitivity/case_prompt_results.csv

  wp3_internvl3_openi_pilot:
    description: Load the public InternVL3-8B BF16 checkpoint, run a one-case compatibility preflight, then conditionally complete the same frozen 10-case Open-I image-description workload with direct GPU board-energy measurement and lexical output screening.
    command:
      - .venv-wp3/bin/python
      - scripts/run_wp3_internvl3_openi_pilot.py
    approval: manual
    timeout_minutes: 90
    requires_gpu: true
    working_directory: .
    resources:
      gpu_count: 1
      min_vram_gb: 24
      wait_minutes: 30
    artifacts:
      - results/wp3/internvl3_openi_pilot/report.json
      - results/wp3/internvl3_openi_pilot/case_results.csv
      - results/wp3/internvl3_openi_pilot/gpu_trace.csv
      - results/wp3/internvl3_openi_pilot/idle_trace.csv

  wp3_two_model_reproducibility:
    description: Resolve and freeze exact Qwen2.5-VL-7B and InternVL3-8B revisions, repeat the frozen 10-case Open-I BF16 energy workload three times per model, rerun pinned output screening, and summarize cross-model repeatability.
    command:
      - .venv-wp3/bin/python
      - scripts/run_wp3_two_model_reproducibility.py
    approval: manual
    timeout_minutes: 90
    requires_gpu: true
    working_directory: .
    resources:
      gpu_count: 1
      min_vram_gb: 24
      wait_minutes: 30
    artifacts:
      - results/wp3/two_model_reproducibility/summary.json
      - results/wp3/two_model_reproducibility/repeats.csv
      - results/wp3/two_model_reproducibility/qwen_case_review.csv
      - results/wp3/two_model_reproducibility/internvl_case_results.csv

  wp3_openi_50case_two_model:
    description: Expand the public Open-I single-image cohort to a deterministic frozen 50-case manifest, run pinned Qwen2.5-VL-7B and InternVL3-8B BF16 energy measurements in five 10-case blocks per model, and aggregate output-screening metrics.
    command:
      - .venv-wp3/bin/python
      - scripts/run_wp3_openi_50case_two_model.py
    approval: manual
    timeout_minutes: 120
    requires_gpu: true
    working_directory: .
    resources:
      gpu_count: 1
      min_vram_gb: 24
      wait_minutes: 30
    artifacts:
      - results/wp3/openi_50case_two_model/summary.json
      - results/wp3/openi_50case_two_model/block_summary.csv
      - results/wp3/openi_50case_two_model/case_manifest_50.csv
      - results/wp3/openi_50case_two_model/qwen_case_review_50.csv
      - results/wp3/openi_50case_two_model/internvl_case_results_50.csv

  wp3_openi_50case_analysis:
    description: Run paired bootstrap analysis of the 50-case Qwen versus InternVL3 results and characterize the full project-local Open-I report archive to define a defensible stratified 100-case sampling design.
    command:
      - python3
      - scripts/analyze_wp3_openi_50case_and_archive.py
    approval: manual
    timeout_minutes: 20
    requires_gpu: false
    working_directory: .
    artifacts:
      - results/wp3/openi_50case_analysis/paired_statistical_analysis.json
      - results/wp3/openi_50case_analysis/archive_characterization.json
      - results/wp3/openi_50case_analysis/mesh_label_counts.csv
      - results/wp3/openi_50case_analysis/stratification_plan.md

  wp3_openi_100case_single_image_two_model:
    description: Freeze a deterministic stratified 100-case Open-I single-image benchmark from exactly one-image reports, then run pinned Qwen2.5-VL-7B and InternVL3-8B BF16 energy measurements in ten 10-case blocks per model with 100-case output screening.
    command:
      - .venv-wp3/bin/python
      - scripts/run_wp3_openi_100case_single_image_two_model.py
    approval: manual
    timeout_minutes: 180
    requires_gpu: true
    working_directory: .
    resources:
      gpu_count: 1
      min_vram_gb: 24
      wait_minutes: 30
    artifacts:
      - results/wp3/openi_100case_single_image_two_model/summary.json
      - results/wp3/openi_100case_single_image_two_model/sampling_report.json
      - results/wp3/openi_100case_single_image_two_model/case_manifest_100.csv
      - results/wp3/openi_100case_single_image_two_model/block_summary.csv
      - results/wp3/openi_100case_single_image_two_model/qwen_case_review_100.csv
      - results/wp3/openi_100case_single_image_two_model/internvl_case_results_100.csv

  wp3_openi_100case_analysis:
    description: Run paired bootstrap inference for the frozen 100-case Qwen versus InternVL3 benchmark, including matched block energy/runtime ratios and exploratory utility subgroup analyses.
    command:
      - python3
      - scripts/analyze_wp3_openi_100case.py
    approval: manual
    timeout_minutes: 20
    requires_gpu: false
    working_directory: .
    artifacts:
      - results/wp3/openi_100case_analysis/paired_analysis.json
      - results/wp3/openi_100case_analysis/subgroup_utility.csv
      - results/wp3/openi_100case_analysis/analysis_report.md

  wp3_remaining_bf16_panel_pilot:
    description: Resolve exact MedGemma-4B and LLaVA-Med-v1.5 revisions, test access and runtime compatibility, and for each compatible model continue directly to a frozen 10-case Open-I BF16 GPU-energy and lexical-screening pilot without aborting the other model on failure.
    command:
      - .venv-wp3/bin/python
      - scripts/run_wp3_remaining_bf16_panel_pilot.py
    approval: manual
    timeout_minutes: 120
    requires_gpu: true
    working_directory: .
    resources:
      gpu_count: 1
      min_vram_gb: 24
      wait_minutes: 30
    artifacts:
      - results/wp3/remaining_bf16_panel_pilot/report.json
      - results/wp3/remaining_bf16_panel_pilot/model_summary.csv
      - results/wp3/remaining_bf16_panel_pilot/case_results.csv

  wp3_medgemma_100case:
    description: Run pinned MedGemma-4B BF16 on the frozen stratified 100-case single-image Open-I cohort in ten matched 10-case blocks with direct GPU board-energy measurement and lexical output screening.
    command:
      - .venv-wp3/bin/python
      - scripts/run_wp3_medgemma_100case.py
    approval: manual
    timeout_minutes: 120
    requires_gpu: true
    working_directory: .
    resources:
      gpu_count: 1
      min_vram_gb: 16
      wait_minutes: 30
    artifacts:
      - results/wp3/medgemma_100case/summary.json
      - results/wp3/medgemma_100case/block_summary.csv
      - results/wp3/medgemma_100case/case_results_100.csv

  wp3_three_model_100case_analysis:
    description: Run matched three-model paired bootstrap analysis for MedGemma-4B, Qwen2.5-VL-7B, and InternVL3-8B on the frozen 100-case Open-I cohort and prepare a blinded 50-case clinical-review packet without performing adjudication.
    command:
      - python3
      - scripts/analyze_wp3_three_model_100case.py
    approval: manual
    timeout_minutes: 30
    requires_gpu: false
    working_directory: .
    artifacts:
      - results/wp3/three_model_100case_analysis/summary.json
      - results/wp3/three_model_100case_analysis/operational_pairwise.csv
      - results/wp3/three_model_100case_analysis/utility_pairwise.csv
      - results/wp3/three_model_100case_analysis/clinical_review_blinded_50.csv
      - results/wp3/three_model_100case_analysis/clinical_review_unblinding_key.csv
      - results/wp3/three_model_100case_analysis/analysis_report.md

  wp3_medgemma_quantization_pilot:
    description: Run a staged MedGemma-4B mitigation pilot on the first 10 cases of the frozen Open-I single-image cohort, comparing BF16, INT8, and INT4 across three repeated 10-case blocks with direct GPU board-energy measurement and lexical screening; incompatible quantized modes are recorded without aborting other modes.
    command:
      - .venv-wp3/bin/python
      - scripts/run_wp3_medgemma_quantization_pilot.py
    approval: manual
    timeout_minutes: 120
    requires_gpu: true
    working_directory: .
    resources:
      gpu_count: 1
      min_vram_gb: 16
      wait_minutes: 30
    artifacts:
      - results/wp3/medgemma_quantization_pilot/summary.json
      - results/wp3/medgemma_quantization_pilot/compatibility.json
      - results/wp3/medgemma_quantization_pilot/block_summary.csv
      - results/wp3/medgemma_quantization_pilot/case_results.csv

  wp3_medgemma_token_budget_100case:
    description: Compare MedGemma-4B BF16 generation limits of 128, 64, and 32 maximum new tokens across the same frozen 100-case Open-I cohort with randomized within-block budget order, direct GPU-board energy, output-token counts, paired bootstrap inference, F1-RadGraph RG_ER fidelity, and energy-utility Pareto analysis.
    command:
      - .venv-wp3/bin/python
      - scripts/run_wp3_medgemma_token_budget_100case.py
    approval: manual
    timeout_minutes: 90
    requires_gpu: true
    working_directory: .
    resources:
      gpu_count: 1
      min_vram_gb: 16
      wait_minutes: 30
    artifacts:
      - results/wp3/medgemma_token_budget_100case/summary.json
      - results/wp3/medgemma_token_budget_100case/block_summary.csv
      - results/wp3/medgemma_token_budget_100case/case_results_300.csv
      - results/wp3/medgemma_token_budget_100case/pairwise_comparisons.csv

  wp5_egrid2023_grid_emissions:
    description: Download and hash EPA eGRID2023 Revision 2, extract annual state and eGRID-subregion CO2-equivalent total output emission rates, convert lb/MWh to kg CO2e/kWh, validate record counts and units, and export the annual grid-emissions layer for population modeling.
    command:
      - python3
      - scripts/run_wp5_egrid2023_grid_emissions.py
    approval: manual
    timeout_minutes: 15
    requires_gpu: false
    working_directory: .
    artifacts:
      - results/wp5/egrid2023/state_co2e_intensity.csv
      - results/wp5/egrid2023/subregion_co2e_intensity.csv
      - results/wp5/egrid2023/summary.json
      - results/wp5/egrid2023/validation_report.md

  wp4_cms_imaging_volume_validation:
    description: Discover the latest CMS geography/service and RBCS API distributions, extract 2024 national Original Medicare fee-for-service Part B imaging service counts, join HCPCS codes to RBCS Imaging taxonomy, and export aggregate modality/subcategory validation tables without treating billing services as full-US examinations.
    command:
      - python3
      - scripts/run_wp4_cms_imaging_volume_validation.py
    approval: manual
    timeout_minutes: 30
    requires_gpu: false
    working_directory: .
    artifacts:
      - results/wp4/cms_imaging_volume/national_imaging_by_rbcs.csv
      - results/wp4/cms_imaging_volume/national_imaging_by_modality.csv
      - results/wp4/cms_imaging_volume/hcpcs_imaging_mapping_audit.csv
      - results/wp4/cms_imaging_volume/summary.json
      - results/wp4/cms_imaging_volume/validation_report.md

  wp4_reconstruct_general_radiology_logic:
    description: Search the user-authorized workstation roots for the exact sus_radio.ipynb notebook, extract only relevant notebook source code/markdown for the BC, COPD, CKD, IHD and CRC disease and imaging logic, and read only headers of relevant broad TriNetX Control tables without exporting notebook outputs or patient-level values.
    command:
      - python3
      - scripts/reconstruct_wp4_general_radiology_logic.py
    approval: manual
    timeout_minutes: 15
    requires_gpu: false
    working_directory: .
    artifacts:
      - results/wp4/general_radiology_logic/notebook_logic.md
      - results/wp4/general_radiology_logic/logic_summary.json
      - results/wp4/general_radiology_logic/relevant_table_schemas.csv

  wp4_general_radiology_clinical_volume:
    description: 'Run the corrected WP4 disease-based clinical-volume pipeline: resolve frozen workstation inputs, run synthetic tests, estimate aggregate 2018-2019 TriNetX disease-by-modality utilization with zero-imaging patient-years retained, and scale observed strata to GBD prevalence without pooled fallback.'
    command:
      - python3
      - scripts/run_wp4_general_radiology_runrelay.py
    approval: manual
    timeout_minutes: 180
    requires_gpu: false
    working_directory: .
    artifacts:
      - results/wp4/general_radiology/resolved_inputs.json
      - results/wp4/general_radiology/cohort_qc.csv
      - results/wp4/general_radiology/ambiguous_zip3_prefixes.csv
      - results/wp4/general_radiology/disease_diagnosis_prefixes.csv
      - results/wp4/general_radiology/cpt_disease_modality_map.csv
      - results/wp4/general_radiology/trinetx_imaging_utilization_annual_long.csv
      - results/wp4/general_radiology/trinetx_imaging_utilization_diagnosis31d_long.csv
      - results/wp4/general_radiology/trinetx_imaging_utilization_national_window_comparison.csv
      - results/wp4/general_radiology/run_metadata.json
      - results/wp4/general_radiology/runrelay_summary.json
      - results/wp4/general_radiology_gbd/gbd_us_state_prevalence_2018_2019.csv
      - results/wp4/general_radiology_gbd/gbd_scaled_imaging_by_stratum.csv
      - results/wp4/general_radiology_gbd/gbd_scaled_imaging_national.csv
      - results/wp4/general_radiology_gbd/gbd_strata_missing_trinetx_rates.csv
      - results/wp4/general_radiology_gbd/gbd_scaling_metadata.json
