schema_version: 1

project:
  id: sustainability-radiology
  repo: vafaei-ar/sustainability-radiology
  visibility: public

execution:
  profile: safe
  approval_default: manual
  machine_binding: fixed
  machine_id: pshjl4vf24
  runner_source: runrelay_control_repo
  exact_commit: true
  allow_arbitrary_commands: false

security:
  project_only_filesystem: true
  network_access: true
  inherit_environment: false
  destructive_operations: false

monitoring:
  heartbeat_seconds: 60
  telegram_include_log_tail: true
  tmux_default: false

tasks:
  smoke_test:
    description: Non-destructive RunRelay connectivity test.
    command:
      - python3
      - -c
      - "import os,platform; print('RUNRELAY_SMOKE_OK'); print('host='+platform.node()); print('cwd='+os.getcwd())"
    approval: manual
    timeout_minutes: 5
    requires_gpu: false
    working_directory: .

  wp1_source_inventory:
    description: Read-only inventory of exact WP1 benchmark CSV filenames under /home/asadr/works, reporting only paths, sizes, and SHA256 digests.
    command:
      - python3
      - scripts/inventory_wp1_sources.py
    approval: manual
    timeout_minutes: 10
    requires_gpu: false
    working_directory: .
    artifacts:
      - results/wp1/source_inventory.txt

  wp1_benchmark_audit:
    description: Materialize frozen benchmark inputs and normalize/audit the three measured historical MONAI GPU benchmark tables using fixed checksums and architecture-matched summaries.
    command:
      - python3
      - scripts/run_wp1_from_gzip.py
    approval: manual
    timeout_minutes: 10
    requires_gpu: false
    working_directory: .
    artifacts:
      - results/wp1/normalized_runs.csv
      - results/wp1/architecture_coverage.csv
      - results/wp1/matched_architecture_summary.csv
      - results/wp1/run_variability.csv
      - results/wp1/wp1_report.md

  wp1_benchmark_audit_legacy_source:
    description: Stage the three checksum-verified historical benchmark summaries from the known legacy project tree and run the WP1 audit.
    command:
      - python3
      - scripts/run_wp1_from_legacy_source.py
    approval: manual
    timeout_minutes: 10
    requires_gpu: false
    working_directory: .
    artifacts:
      - results/wp1/normalized_runs.csv
      - results/wp1/architecture_coverage.csv
      - results/wp1/matched_architecture_summary.csv
      - results/wp1/run_variability.csv
      - results/wp1/wp1_report.md

  wp1_hardware_comparison:
    description: Collapse WP1 replicates to architecture-level medians and compute paired cross-GPU energy ratios with architecture-resampled bootstrap intervals where adequately supported.
    command:
      - python3
      - scripts/run_wp1_hardware_comparison.py
    approval: manual
    timeout_minutes: 10
    requires_gpu: false
    working_directory: .
    artifacts:
      - results/wp1/architecture_level_summary.csv
      - results/wp1/paired_gpu_ratios.csv
      - results/wp1/wp1_hardware_comparison.md
