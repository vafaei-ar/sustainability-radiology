<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
  <rect width="900" height="650" fill="white"/>
  <text x="450" y="36" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold">GPU board energy versus automated report fidelity</text>
  <text x="450" y="61" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14">Frozen 100-case Open-I single-image benchmark</text>

  <line x1="105" y1="555" x2="825" y2="555" stroke="black" stroke-width="2"/>
  <line x1="105" y1="555" x2="105" y2="95" stroke="black" stroke-width="2"/>

  <g font-family="Arial, Helvetica, sans-serif" font-size="13">
    <line x1="105" y1="555" x2="105" y2="562" stroke="black"/><text x="105" y="582" text-anchor="middle">0.05</text>
    <line x1="265" y1="555" x2="265" y2="562" stroke="black"/><text x="265" y="582" text-anchor="middle">0.10</text>
    <line x1="425" y1="555" x2="425" y2="562" stroke="black"/><text x="425" y="582" text-anchor="middle">0.15</text>
    <line x1="585" y1="555" x2="585" y2="562" stroke="black"/><text x="585" y="582" text-anchor="middle">0.20</text>
    <line x1="745" y1="555" x2="745" y2="562" stroke="black"/><text x="745" y="582" text-anchor="middle">0.25</text>

    <line x1="98" y1="519" x2="105" y2="519" stroke="black"/><text x="88" y="524" text-anchor="end">0.08</text>
    <line x1="98" y1="411" x2="105" y2="411" stroke="black"/><text x="88" y="416" text-anchor="end">0.12</text>
    <line x1="98" y1="303" x2="105" y2="303" stroke="black"/><text x="88" y="308" text-anchor="end">0.16</text>
    <line x1="98" y1="195" x2="105" y2="195" stroke="black"/><text x="88" y="200" text-anchor="end">0.20</text>
    <line x1="98" y1="87" x2="105" y2="87" stroke="black"/><text x="88" y="92" text-anchor="end">0.24</text>
  </g>

  <text x="465" y="620" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16">Mean gross GPU board energy (Wh/case)  → higher energy</text>
  <text x="28" y="330" transform="rotate(-90 28 330)" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16">Mean F1-RadGraph RG_ER  → higher fidelity</text>

  <!-- MedGemma: x=0.0790, y=0.2204 -->
  <circle cx="198" cy="140" r="10" fill="black"/>
  <text x="215" y="133" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold">MedGemma</text>
  <text x="215" y="153" font-family="Arial, Helvetica, sans-serif" font-size="13">0.079 Wh/case; RG_ER 0.220</text>

  <!-- Qwen: x=0.1615, y=0.1723 -->
  <circle cx="462" cy="270" r="10" fill="#777"/>
  <text x="479" y="263" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold">Qwen</text>
  <text x="479" y="283" font-family="Arial, Helvetica, sans-serif" font-size="13">0.162 Wh/case; RG_ER 0.172</text>

  <!-- InternVL3: x=0.2083, y=0.0995 -->
  <circle cx="612" cy="466" r="10" fill="white" stroke="black" stroke-width="2"/>
  <text x="629" y="459" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold">InternVL3</text>
  <text x="629" y="479" font-family="Arial, Helvetica, sans-serif" font-size="13">0.208 Wh/case; RG_ER 0.100</text>

  <path d="M198 140 L462 270 L612 466" fill="none" stroke="#999" stroke-dasharray="5 5" stroke-width="1.5"/>
  <text x="650" y="115" font-family="Arial, Helvetica, sans-serif" font-size="13">Preferred direction: upper-left</text>
  <path d="M785 125 L725 125 L725 175" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="black"/></marker></defs>

  <text x="105" y="640" font-family="Arial, Helvetica, sans-serif" font-size="11">Utility is automated reference-based F1-RadGraph, not radiologist-adjudicated diagnostic performance.</text>
</svg>
