<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620">
  <rect width="1000" height="620" fill="white"/>
  <text x="500" y="35" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold">Operational energy and automated report fidelity by model</text>
  <text x="500" y="60" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14">Frozen 100-case Open-I single-image benchmark</text>

  <text x="255" y="102" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold">A. Gross GPU board energy</text>
  <line x1="90" y1="500" x2="450" y2="500" stroke="black" stroke-width="2"/>
  <line x1="90" y1="500" x2="90" y2="130" stroke="black" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="12">
    <text x="78" y="504" text-anchor="end">0.00</text>
    <text x="78" y="420" text-anchor="end">0.05</text>
    <text x="78" y="336" text-anchor="end">0.10</text>
    <text x="78" y="252" text-anchor="end">0.15</text>
    <text x="78" y="168" text-anchor="end">0.20</text>
  </g>
  <text x="35" y="315" transform="rotate(-90 35 315)" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14">Wh per completed case</text>

  <rect x="125" y="367" width="70" height="133" fill="#222"/>
  <rect x="235" y="229" width="70" height="271" fill="#777"/>
  <rect x="345" y="150" width="70" height="350" fill="#bbb" stroke="black" stroke-width="1"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="12">
    <text x="160" y="355" text-anchor="middle">0.079</text>
    <text x="270" y="217" text-anchor="middle">0.162</text>
    <text x="380" y="138" text-anchor="middle">0.208</text>
    <text x="160" y="522" text-anchor="middle">MedGemma</text>
    <text x="270" y="522" text-anchor="middle">Qwen</text>
    <text x="380" y="522" text-anchor="middle">InternVL3</text>
  </g>

  <text x="745" y="102" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold">B. F1-RadGraph RG_ER</text>
  <line x1="580" y1="500" x2="940" y2="500" stroke="black" stroke-width="2"/>
  <line x1="580" y1="500" x2="580" y2="130" stroke="black" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="12">
    <text x="568" y="504" text-anchor="end">0.00</text>
    <text x="568" y="420" text-anchor="end">0.05</text>
    <text x="568" y="336" text-anchor="end">0.10</text>
    <text x="568" y="252" text-anchor="end">0.15</text>
    <text x="568" y="168" text-anchor="end">0.20</text>
  </g>
  <text x="525" y="315" transform="rotate(-90 525 315)" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14">Mean RG_ER score</text>

  <rect x="615" y="130" width="70" height="370" fill="#222"/>
  <rect x="725" y="210" width="70" height="290" fill="#777"/>
  <rect x="835" y="333" width="70" height="167" fill="#bbb" stroke="black" stroke-width="1"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="12">
    <text x="650" y="118" text-anchor="middle">0.220</text>
    <text x="760" y="198" text-anchor="middle">0.172</text>
    <text x="870" y="321" text-anchor="middle">0.100</text>
    <text x="650" y="522" text-anchor="middle">MedGemma</text>
    <text x="760" y="522" text-anchor="middle">Qwen</text>
    <text x="870" y="522" text-anchor="middle">InternVL3</text>
  </g>

  <text x="500" y="565" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13">MedGemma had both the lowest measured gross GPU-board energy and the highest automated RadGraph fidelity.</text>
  <text x="500" y="590" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11">RadGraph is an automated reference-based report-fidelity metric and is not a substitute for radiologist adjudication.</text>
</svg>
